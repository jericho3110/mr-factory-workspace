[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrfactory-adspower"
version = "0.5.0"
description = "Open AdsPower; look up groups, tags, profiles, and proxies; open, create (one or many), and re-proxy profiles; check proxies."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only the proxy check needs it (proxycheck.py): pip install "mrfactory-adspower[browser]"
browser = ["playwright>=1.40"]

[project.scripts]
adspower = "mrfactory.adspower.cli:main"

# `mrfactory` is a namespace package shared by every package in the
# workspace. See docs/CONVENTIONS.md at the workspace root.
[tool.setuptools.packages.find]
where = ["src"]
include = ["mrfactory.adspower*"]
namespaces = true
