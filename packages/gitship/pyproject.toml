[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrfactory-gitship"
version = "0.1.0"
description = "Check, scan, commit, push, publish and release a git repo safely, the same way every time."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gitship = "mrfactory.gitship.cli:main"

# `mrfactory` is a namespace package shared by every package in the
# workspace. See docs/CONVENTIONS.md at the workspace root.
[tool.setuptools.packages.find]
where = ["src"]
include = ["mrfactory.gitship*"]
namespaces = true
