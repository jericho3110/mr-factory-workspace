[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrfactory-mouse-ext"
version = "0.1.0"
description = "Plugins and extensions for natural_mouse."
requires-python = ">=3.10"
# natural_mouse itself is deliberately NOT listed here: it isn't on PyPI,
# and listing it would make pip go looking for a same-named package there.
# Install it from the sibling project first: pip install -e ../Natural
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
]

# The built-in plugins, advertised the same way a third-party package
# would advertise its own (see PluginManager.load_entry_points).
[project.entry-points."mrfactory.mouse_ext.plugins"]
logging = "mrfactory.mouse_ext.plugins:LoggingPlugin"
stats = "mrfactory.mouse_ext.plugins:StatsPlugin"

# `mrfactory` is a namespace package shared by every package in the
# workspace: no mrfactory/__init__.py, and each package ships only its
# own subpackage. See docs/CONVENTIONS.md at the workspace root.
[tool.setuptools.packages.find]
where = ["src"]
include = ["mrfactory.mouse_ext*"]
namespaces = true
